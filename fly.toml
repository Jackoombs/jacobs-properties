# fly.toml for jacobs-properties-v2 (static Astro site served by nginx).
# Rename `app` below to whatever you register with `fly apps create <name>`.

app = "jacobs-properties-v2"
primary_region = "lhr"

[build]
  # Uses the same production Dockerfile as docker-compose.prod.yml.
  dockerfile = "Dockerfile"

  # PUBLIC_* values are baked into the static HTML/JS at BUILD time, not read
  # at runtime, so they belong here rather than in [env] or `fly secrets`.
  # The property list is also fetched during the build, so the API must be
  # deployed and reachable before this app is deployed (and the site needs a
  # redeploy to pick up new properties).
  #
  # PUBLIC_GOOGLE_MAPS_KEY ends up in client-side JS anyway, but is kept out
  # of this file. Pass it on the command line:
  #   fly deploy --build-arg PUBLIC_GOOGLE_MAPS_KEY=...
  [build.args]
    PUBLIC_SERVER_URL = "https://jacobs-properties-api.fly.dev/"
    PUBLIC_CMS_URL = "https://jacobs-properties-cms.fly.dev/"

[http_service]
  # nginx-unprivileged listens on 8080 (see nginx.conf).
  internal_port = 8080
  force_https = true
  # Static files only, so the site can scale to zero and wake on request.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    # Same check as the Dockerfile HEALTHCHECK.
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
